name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - data/rates.json
      - .github/workflows/pages.yml
  workflow_dispatch:
  # GITHUB_TOKEN commits don't trigger push workflows. Deploy after the collector finishes.
  workflow_run:
    workflows: [Fetch rates]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare static files only
        run: |
          python3 -m json.tool data/rates.json > /dev/null
          mkdir -p _site/data
          cp index.html _site/index.html
          cp app.js _site/app.js
          cp data/rates.json _site/data/rates.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
