<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易所活期理财收益对比</title><link rel="icon" href="data:,">
<style>body{background:#0b0f17;color:#e6e9ef;font-family:system-ui,"PingFang SC",sans-serif;margin:0;padding:20px;max-width:1200px;margin:auto}
h1{font-size:22px}.muted{color:#8a93a6;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:6px}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}.tab{background:#1a2030;border:1px solid #2a3245;color:#cfd5e2;padding:8px 16px;border-radius:8px;cursor:pointer}.tab.on{background:#f39c12;color:#111;font-weight:700}
.box{background:#121826;border:1px solid #232b3d;border-radius:12px;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.best{background:#0e1320;border-radius:8px;padding:10px;font-size:13px}.g{color:#2ecc71;font-weight:700;font-size:18px}.o{color:#f39c12}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}.row{border-top:1px solid #222a3b;padding:8px 0;font-size:13px}
.tag{border:1px solid #3a6;color:#8fd;padding:1px 6px;border-radius:4px;font-size:11px}.track{height:6px;background:#222a3b;border-radius:3px;flex:1;margin:0 10px}.fill{height:6px;border-radius:3px;background:linear-gradient(90deg,#f39c12,#2ecc71)}
input[type=number]{width:90px;background:#0b0f17;color:#fff;border:1px solid #2a3245;border-radius:6px;padding:4px}details{color:#8a93a6;font-size:12px;overflow-wrap:anywhere}.bad{color:#e67e22;font-size:12px;white-space:pre-line}.stale{border-color:#a76b32;color:#f3b871}.coin-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.rate-row{display:flex;align-items:center}.rate-row b{white-space:nowrap}.tab:focus-visible,input:focus-visible{outline:2px solid #f39c12;outline-offset:3px}.dot.stale{background:#e67e22}</style></head><body>
<h1>🍊 交易所活期理财收益对比</h1><div class="muted"><span class="dot" id="health"></span><span id="age">正在加载数据…</span> · 每小时采集<br>最近更新：<span id="up">-</span>（北京时间 UTC+8）</div>
<div class="bar"><button type="button" class="tab on" data-t="stable" aria-pressed="true">稳定币</button><button type="button" class="tab" data-t="major" aria-pressed="false">主流币</button><button type="button" class="tab" data-t="all" aria-pressed="false">全部</button>
<label class="muted"><input type="checkbox" id="nu"> 计入新用户/限额专享（仅 Bitget 可识别，推断）</label></div>
<div id="st" class="bad" role="status" aria-live="polite"></div><div class="box"><b>🏆 每个币种最高展示年化（按输入金额，混合年化）</b><div class="grid" id="best"></div></div><div class="cards" id="cards"></div>
<p class="muted">页面展示定时采集的利率快照。交易所采集失败时保留上次成功数据，并标注旧数据时间。Bybit 密钥（如配置）仅在采集任务中使用。利率为年化，浮动利率随市场变化；仅作信息参考，不构成投资建议，存款前请自行核实。</p>
<script src="./app.js" defer></script></body></html>
